# رسالة تنشيط تلقائية لمشروع Supabase كل 3 أيام (ليست طلباً حقيقياً)
# مكان الملف في المستودع: .github/workflows/keepalive.yml
name: HRI Supabase Keepalive (automatic ping - NOT a real request)

on:
  schedule:
    - cron: '17 6 */3 * *'   # كل 3 أيام الساعة 06:17 UTC
  workflow_dispatch:          # تشغيل يدوي من تبويب Actions للتجربة

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (keepalive only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive_ping" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "User-Agent: HRI-Keepalive-Bot (automatic ping - NOT a real request)" \
            -H "X-Keepalive: automatic-ping-not-a-real-request" \
            -d '{}'
          echo
